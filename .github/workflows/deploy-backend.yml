name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Backend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Syntax
        run: |
          node -c backend/server.js
          node -c backend/app.js

  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment on EC2..."
            cd ~/interview-ai

            # Pull latest changes from main
            git fetch origin main
            git reset --hard origin/main

            # Build and restart backend container
            cd backend
            docker compose up -d --build

            # Verify health check
            sleep 5
            curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:5000/health

            # Prune dangling unused images
            docker image prune -f

            echo "Deployment to AWS EC2 completed successfully!"
