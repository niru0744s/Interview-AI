name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "main", "codex/niru" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Backend Syntax
        run: |
          node -c backend/server.js
          node -c backend/app.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner Name
        run: |
          echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/interview-ai-backend:latest
            ghcr.io/${{ env.REPO_OWNER }}/interview-ai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase Repository Owner Name
        run: |
          echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REPO_OWNER
          script: |
            set -e
            echo "Starting deployment on EC2..."
            mkdir -p ~/interview-ai/backend
            cd ~/interview-ai/backend

            # Write production environment variables if provided
            if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
              cat > .env << 'ENV_EOF'
${{ secrets.BACKEND_ENV }}
ENV_EOF
            fi

            # Log in to GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull latest image
            IMAGE_NAME="ghcr.io/${REPO_OWNER}/interview-ai-backend:latest"
            docker pull "$IMAGE_NAME"

            # Create production docker-compose if not present
            cat << 'EOF' > docker-compose.prod.yml
            services:
              backend:
                image: ghcr.io/${REPO_OWNER}/interview-ai-backend:latest
                container_name: interview-ai-backend
                restart: always
                ports:
                  - "127.0.0.1:5000:5000"
                env_file:
                  - .env
                environment:
                  - PORT=5000
                  - NODE_ENV=production
                healthcheck:
                  test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            EOF

            # Restart container with latest image
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Wait and test health check
            sleep 5
            curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:5000/health || (echo "Health check failed!" && exit 1)

            # Clean up old images
            docker image prune -f
            echo "Deployment successful!"
