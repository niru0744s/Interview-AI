services:
  backend:
    image: ghcr.io/niru0744s/interview-ai-backend:latest
    container_name: interview-ai-backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
